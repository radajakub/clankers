name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --project packages/python --group dev --python 3.13

      - name: Ruff lint
        run: uv run --project packages/python ruff check --config packages/python/pyproject.toml packages/python scripts

      - name: Ruff format check
        run: uv run --project packages/python ruff format --config packages/python/pyproject.toml --check packages/python scripts

      - name: Prettier format check
        run: npx --yes prettier@3.9.6 --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --project packages/python --group dev --python 3.13

      - name: Run tests
        run: uv run --project packages/python --group dev pytest -q packages/python/tests

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build --project packages/python --out-dir dist

      - name: Check package metadata
        run: uvx twine check dist/*
